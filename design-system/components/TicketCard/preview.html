<!-- @dsCard group="Bilhetes" height=440 -->
<!doctype html>
<html lang="pt-PT">
<head><meta charset="utf-8"><title>TicketCard — preview</title></head>
<body>
<section data-theme="noite">
<ul class="fj-tickets">
  <li class="fj-ticket">
    <h3 class="fj-ticket__name">Sexta, 30 julho</h3>
    <p class="fj-ticket__when">Bilhete diário · portas às 16h00</p>
    <p class="fj-ticket__price">25 € <small>Taxa incluída</small></p>
    <button class="fj-btn fj-btn--secondary fj-btn--block" type="button">Escolher</button>
  </li>
  <li class="fj-ticket fj-ticket--featured">
    <span class="fj-badge fj-ticket__badge">Mais vendido</span>
    <h3 class="fj-ticket__name">Passe 2 dias</h3>
    <p class="fj-ticket__when">30 e 31 julho</p>
    <p class="fj-ticket__price">40 € <small>Taxa incluída</small></p>
    <ul class="fj-ticket__list"><li>Entrada nos dois dias</li><li>Pulseira cashless</li></ul>
    <button class="fj-btn fj-btn--primary fj-btn--block" type="button">Comprar passe</button>
  </li>
  <li class="fj-ticket fj-ticket--soldout">
    <span class="fj-badge fj-badge--soldout fj-ticket__badge">Esgotado</span>
    <h3 class="fj-ticket__name">Early bird</h3>
    <p class="fj-ticket__when">30 e 31 julho</p>
    <p class="fj-ticket__price">30 €</p>
    <button class="fj-btn fj-btn--primary fj-btn--block" type="button" aria-disabled="true">Esgotado</button>
  </li>
</ul>
</section>

</body>
</html>
